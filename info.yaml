project:
  title: "9T DCIM SRAM Macro"   # Project title (e.g. "Simple CPU", "PLL", "ADC")
  team: "A07 Blueprints"        # Your Team name
  discord: "kammy_r"            # Optional: Discord username (for support / communication)
