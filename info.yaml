pins:
  - name: clk
    io_type: input_cmos
  - name: rst_n
    io_type: input_schmitt
  - name: a_bit
    io_type: input_cmos
  - name: w_bit
    io_type: input_cmos
  - name: start
    io_type: input_cmos
  - name: cont
    io_type: input_cmos
  - name: P_minus1_0
    io_type: input_cmos
  - name: P_minus1_1
    io_type: input_cmos
  - name: P_minus1_2
    io_type: input_cmos
  - name: y_bit
    io_type: bidirectional
  - name: done
    io_type: bidirectional
  - name: busy
    io_type: bidirectional
  - name: vdd
    io_type: power
  - name: vss
    io_type: ground  # note: due to a common ground connection, ground pads are generally not needed.