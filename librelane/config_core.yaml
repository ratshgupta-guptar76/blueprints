meta:
  version: 3
  flow: ClassicWithPadframeBridge
  substituting_steps:
    # Disable KLayout DRC
    # KLayout.DRC: null
    # Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    # KLayout.Antenna: null
    # Checker.KLayoutAntenna: null

    # Disable KLayout density check
    # KLayout.Density: null
    # Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    # OpenROAD.IRDropReport: null
    # Magic.DRC: null
    # Checker.MagicDRC: null
    # KLayout.XOR: null
    # Netgen.LVS: null
    # Checker.LVS: null

DESIGN_NAME: A07_dcim_top

VERILOG_FILES:
- dir::../src/dcim_pkg.sv
- dir::../src/shift_reg.sv
- dir::../src/act_shift_chain.sv
- dir::../src/row_decoder.sv
- dir::../src/dcim_array.sv
- dir::../src/col_adder.sv
- dir::../src/adder_tree.sv
- dir::../src/lane_shift_accum.sv
- dir::../src/shift_accum.sv
- dir::../src/weight_load.sv
- dir::../src/stream_out.sv
- dir::../src/control_fsm.sv
- dir::../src/dcim_top.sv
- dir::../src/A07_dcim_top.sv
- dir::../ip/sram_32x8_9T/vh/sram_32x8_9T_blackbox.v

# SDC file updated for core
PNR_SDC_FILE: dir::chip_core.sdc
SIGNOFF_SDC_FILE: dir::chip_core.sdc
FALLBACK_SDC: dir::chip_core.sdc

# Enable plugin for better SystemVerilog support
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
# RUN_MAGIC_STREAMOUT: False

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# Direct clock port on chip_core
CLOCK_PORT: clk
CLOCK_NET: clk
CLOCK_PERIOD: 40

# Fix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

CTS_SINK_BUFFER_MAX_CAP_DERATE_PCT: 85

CTS_DISTANCE_BETWEEN_BUFFERS: 250

DESIGN_REPAIR_MAX_CAP_PCT: 70

# Increase for more logic
# on your die
PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

FP_DEF_TEMPLATE: "dir::../def/A07/project_defs/A/A07_A.def"

# IO_PIN_ORDER_CFG: dir::io_pin_order.cfg

# Disable core ring pad connection & enable seal ring
PDN_CORE_RING: True
PDN_CORE_RING_CONNECT_TO_PADS: False

FP_SIZING: absolute
DIE_AREA: [0, 0, 1110, 1110]
CORE_AREA: [100, 100, 1010, 1010]

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 4
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_ENABLE_PINS: True
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

# Halo around macros for row-cutting and for the PDN macro grid
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
PDN_HORIZONTAL_HALO: 5
PDN_VERTICAL_HALO: 5

PDN_CFG: dir::pdn_core_cfg.tcl

# sram_bitcell_9T is instantiated 256x inside sram_32x8_9T.nl.v below -- it
# has no gds/lef of its own (it's part of the sram_32x8_9T tile), so it
# can't be a MACRO entry. EXTRA_LIBS loads its Liberty timing arcs for
# every STA corner unconditionally (see ip/sram_32x8_9T/nl/gen_nl.py).
# tt-only: EXTRA_LIBS is a flat, corner-blind list, so it can't be keyed
# like MACROS.lib/.spef below. NOTE: embedding sram_bitcell_9T's cell()
# group into sram_32x8_9T's own per-corner .lib (as gen_lib.py now can, via
# gen_bitcell_lib.write_cell_block) does NOT help here and was tried and
# reverted: librelane/common/toolbox.py's get_timing_files_categorized
# skips a macro's own `lib:` entirely whenever `nl:`/`spef:` are present
# (STA_MACRO_PRIORITIZE_NL defaults True) -- confirmed by an empirical run
# showing zero SRAM-instance mentions in any STA report once EXTRA_LIBS was
# removed. EXTRA_LIBS (or a per-corner equivalent) is structurally required
# as long as nl/spef are kept for hierarchical SPEF-based STA.
EXTRA_LIBS:
- dir::../ip/sram_32x8_9T/lib/sram_bitcell_9T__tt_025C_3v30.lib

MACROS:
  sram_32x8_9T:
    gds:
      - dir::../ip/sram_32x8_9T/gds/sram_32x8_9T.gds
    lef:
      - dir::../ip/sram_32x8_9T/lef/sram_32x8_9T.lef
    vh:
      - dir::../ip/sram_32x8_9T/vh/sram_32x8_9T_blackbox.v
    lib:
      "*_tt_025C_3v30":
        - dir::../ip/sram_32x8_9T/lib/sram_32x8_9T__tt_025C_3v30.lib
      "*_ff_n40C_3v60":
        - dir::../ip/sram_32x8_9T/lib/sram_32x8_9T__ff_n40C_3v60.lib
      "*_ss_125C_3v00":
        - dir::../ip/sram_32x8_9T/lib/sram_32x8_9T__ss_125C_3v00.lib
    nl:
      - dir::../ip/sram_32x8_9T/nl/sram_32x8_9T.nl.v
    spef:
      "*":
        - dir::../ip/sram_32x8_9T/spef/sram_32x8_9T.spef
    instances:
      U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_0:
        location: [300, 250]
        orientation: MY
      U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_1:
        location: [700, 250]
        orientation: MY
      U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_2:
        location: [300, 650]
        orientation: MY
      U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_3:
        location: [700, 650]
        orientation: MY

LVS_IGNORE_CELLS:
- gf180mcu_as_sc_mcu7t3v3__fill_1
- gf180mcu_as_sc_mcu7t3v3__fill_2
- gf180mcu_as_sc_mcu7t3v3__fillcap_4
- gf180mcu_as_sc_mcu7t3v3__fillcap_8
- gf180mcu_as_sc_mcu7t3v3__fillcap_16

PDN_MACRO_CONNECTIONS:
- "U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_0 VDD VSS VDD VSS"
- "U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_1 VDD VSS VDD VSS"
- "U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_2 VDD VSS VDD VSS"
- "U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_3 VDD VSS VDD VSS"

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Global thread count per worker process
KLAYOUT_DRC_THREADS: 4

# DRC options block containing worker count
KLAYOUT_DRC_OPTIONS:
  feol: true
  beol: true
  run_mode: "deep"
  conn_drc: true
  dummy: true
  dummy_no_sub_prev: true
  offgrid: true
  wedge: true
  decks: "all,-antenna,-density,-cup"
  variant: ref::$PDK
  workers: max

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max
