meta:
  version: 3
  flow: Classic
  substituting_steps:
    # Disable KLayout DRC
    # KLayout.DRC: null
    # Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    # KLayout.Antenna: null
    # Checker.KLayoutAntenna: null

    # Disable KLayout density check
    # KLayout.Density: null
    # Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    # OpenROAD.IRDropReport: null
    # Magic.DRC: null
    # Checker.MagicDRC: null
    # KLayout.XOR: null
    # Netgen.LVS: null
    # Checker.LVS: null

    # OpenROAD PSM (Checker.PowerGridViolations) needs power-pad terminal
    # locations (VSRC_LOC_FILES) to analyze the grid, which only exist on
    # a padded chip-level design. chip_core has no pads, so PSM reports
    # both VDD/VSS as violations ("does not contain any terminals")
    # regardless of grid correctness -- same reason LVS is disabled above.
    # Checker.PowerGridViolations: null

DESIGN_NAME: dcim_top

VERILOG_FILES:
- dir::../src/dcim_pkg.sv
- dir::../src/shift_reg.sv
- dir::../src/act_shift_chain.sv
- dir::../src/row_decoder.sv
- dir::../src/dcim_array.sv
- dir::../src/col_adder.sv
- dir::../src/adder_tree.sv
- dir::../src/lane_shift_accum.sv
- dir::../src/shift_accum.sv
- dir::../src/weight_load.sv
- dir::../src/stream_out.sv
- dir::../src/control_fsm.sv
- dir::../src/dcim_top.sv
- dir::../ip/sram_32x8_9T/vh/sram_32x8_9T_blackbox.v

# SDC file updated for core
PNR_SDC_FILE: dir::chip_core.sdc
SIGNOFF_SDC_FILE: dir::chip_core.sdc
FALLBACK_SDC: dir::chip_core.sdc

IGNORE_DISCONNECTED_MODULES:
- dcim_top

# Remove pad-specific configs
# IGNORE_DISCONNECTED_MODULES removed (no IO pad blackboxes)
# EXTRA_VERILOG_MODELS for pads removed

# Enable plugin for better SystemVerilog support
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
RUN_MAGIC_STREAMOUT: False

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# Direct clock port on chip_core
CLOCK_PORT: clk
CLOCK_NET: clk
CLOCK_PERIOD: 40

# Fix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# gf180mcu_as_sc_mcu7t3v3__clkbuff_12 (the strongest clock buffer in this
# SCL -- only _4/_8/_12 exist) has a 0.200pF max_capacitance. Left
# unset (default 100 = no derating), CTS's automatic buffer selection
# sizes clusters right up against that limit at zero margin, so the same
# fanout comes out over the limit at slower PVT corners (repair_design-
# family steps don't touch clock nets, so this has to be fixed at CTS
# time, not patched after -- CTS_MAX_CAP does NOT affect this; it only
# tunes wire-segment characterization, confirmed to have zero effect on
# this design's tree, hence the derate below instead).
CTS_SINK_BUFFER_MAX_CAP_DERATE_PCT: 85

# The derate above tunes leaf-buffer sink clustering, not the tree's
# higher levels -- clkbuf_0_clk (the root, forced onto clkbuff_12 via
# CTS_ROOT_BUFFER) and an intermediate H-tree buffer are still over
# max_capacitance on the worst corners, worse since the die grew to
# match Block A (1110x1110). Unlike CTS_CLK_MAX_WIRE_LENGTH (a post-CTS
# repair_clock_nets split that previously made the worst corners worse
# while fixing nominal -- reverted), this acts during tree construction
# itself, capping the physical span between buffer levels so long
# trunk/branch runs get subdivided going in, not patched after.
CTS_DISTANCE_BETWEEN_BUFFERS: 300

# RepairDesignPostGPL's own default 20% cap margin (DESIGN_REPAIR_MAX_CAP_PCT)
# is checked against ONE analysis corner, but signoff STA checks all 9.
# At 55%, min_*/nom_* corners are fully clean but 5 repair buffers
# (max_capNN/wireNN, non-clock -- CTS_DISTANCE_BETWEEN_BUFFERS above
# already cleared the clock-tree violators) are still over on the 3
# worst-case corners, all within ~9% of the limit. Widened further.
DESIGN_REPAIR_MAX_CAP_PCT: 70

# Tried CTS_CLK_MAX_WIRE_LENGTH: 300 to also split the CTS root buffer's
# (clkbuf_0_clk) long trunk wire via `repair_clock_nets` -- it cleared
# the nominal-corner violations but made the worst corners (max_tt/ff/ss)
# go from 2 to 4 violations each, a net regression. Reverted; not a
# signoff blocker, revisit later if needed.

# Increase for more logic
# on your die
PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# Places the 12 signal pins on the specific sides/order the Chipathon
# 2026 padframe Block A expects (E12-E22, N01-N11 -- see
# docs/sram-macro.md). Activates Odb.CustomIOPlacement, which only
# handles signal pins (bterm.getSigType() not in ["POWER", "GROUND"]
# is hardcoded in odbpy/io_place.py) -- vdd/vss are NOT listed in the
# cfg file: their physical location comes from the PDN core ring
# below instead, which is continuous around the whole boundary and so
# already reaches wherever E12 (the padframe's forced ground position)
# physically falls, with no separate placement step needed.
#
# East side (E12-E22, ascending = bottom-to-top, matching this
# mechanism's required bottom-to-top order for E/W directly): E12
# itself is the ground ring contact (not in the cfg), the 9 remaining
# signal pins fill toward E22.
# North side (N01-N11, ascending = left-to-right, matching this
# mechanism's required left-to-right order for N/S directly): our 3
# outputs take N01-N03; N04-N11 (8 positions) are unused for this
# design and reserved as virtual/unplaced slots ($8 in the cfg) so
# the real pins land at the start of the range instead of being
# spread across the full N01-N11 span.
#
# This gets the correct SIDE and RELATIVE ORDER, which is the
# achievable part without the organizers' own padframe LEF; exact
# micron-pitch alignment with the shared frame (so our track grid's
# 9-signal spacing on the E side lines up with wherever the real
# frame expects positions E13-E22 to physically be) is something only
# their integration process or a real padframe LEF can fully confirm.
IO_PIN_ORDER_CFG: dir::io_pin_order.cfg

# Disable core ring pad connection & enable seal ring
PDN_CORE_RING: True
PDN_CORE_RING_CONNECT_TO_PADS: False

# Fixed 1100x1100um core, with margin around it for the PDN core ring.
# The ring is drawn per-net (VDD + VSS), so the actual stack is
# offset(6) + width(25) + spacing(1.7) + width(25) = ~57.7um -- 100um
# margin leaves headroom for that plus routing/via clearance.
IO_EXCLUDE_PIN_REGION:
  - "bottom:*"
  - "right:*"

# Sized to Chipathon 2026 padframe Block A exactly (1110x1110um,
# 22-pin quadrant, pin order E12-E22,N01-N11 -- see the Chipathon 2026
# Padframe proposal deck). Core margin kept proportional to the
# previous 100um.
FP_SIZING: absolute
DIE_AREA: [0, 0, 1110, 1110]
CORE_AREA: [100, 100, 1010, 1010]

# PDN - Straps
# HPITCH/VPITCH=75 is smaller than the SRAM macro height (181.215um), so
# every macro crosses at least 2 horizontal straps regardless of its exact
# Y placement (see dcim_macro_rot in pdn_core_cfg.tcl).
PDN_VWIDTH: 5
PDN_HWIDTH: 4
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
# Promotes the PDN straps to labeled block pins (LibreLane default is
# True; this was False for the padded chip_top flow, where physical
# IO pad cells make the boundary connection instead). This submission
# has no padring -- the Chipathon 2026 padframe organizers connect
# directly to this block's boundary, so VDD/VSS need real, named
# terminals here, matching the vss/vdd entries in info.yaml.
PDN_ENABLE_PINS: True
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

# Halo around macros for row-cutting and for the PDN macro grid
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
PDN_HORIZONTAL_HALO: 5
PDN_VERTICAL_HALO: 5

# Custom macro PDN grid (grid_over_boundary workaround for the SRAM's
# narrow Metal3 pins) -- same script the padring flow uses.
PDN_CFG: dir::pdn_core_cfg.tcl

# sram_bitcell_9T is instantiated 256x inside sram_32x8_9T.nl.v below --
# it has no gds/lef of its own (it's part of the sram_32x8_9T tile), so it
# can't be a MACRO entry. EXTRA_LIBS loads its Liberty timing arcs for
# every STA corner unconditionally (see ip/sram_32x8_9T/nl/gen_nl.py).
# tt-only despite gen_bitcell_lib.py now producing all 3 corners: EXTRA_LIBS
# is a flat, corner-blind list ("loaded indiscriminately for all timing
# corners" -- librelane/config/flow.py), so it can't be keyed like
# MACROS.lib/.spef below. This is a real, smaller-granularity approximation
# (accepted, not fixable without a custom flow step) distinct from the
# macro-level lib, which IS now properly per-corner.
EXTRA_LIBS:
- dir::../ip/sram_32x8_9T/lib/sram_bitcell_9T__tt_025C_3v30.lib

MACROS:
  sram_32x8_9T:
    gds:
      - dir::../ip/sram_32x8_9T/gds/sram_32x8_9T.gds
    lef:
      - dir::../ip/sram_32x8_9T/lef/sram_32x8_9T.lef
    vh:
      - dir::../ip/sram_32x8_9T/vh/sram_32x8_9T_blackbox.v
    # Approximate blackbox timing, used during mid-PnR optimization
    # (placement/CTS/resizing) where only estimated parasitics exist.
    # Real per-corner data now (gen_lib.py), not just the tt corner
    # reused everywhere -- wildcard keys match the PDK SCL's own
    # convention (gf180mcu_as_sc_mcu7t3v3/config.tcl's LIB dict).
    lib:
      "*_tt_025C_3v30":
        - dir::../ip/sram_32x8_9T/lib/sram_32x8_9T__tt_025C_3v30.lib
      "*_ff_n40C_3v60":
        - dir::../ip/sram_32x8_9T/lib/sram_32x8_9T__ff_n40C_3v60.lib
      "*_ss_125C_3v00":
        - dir::../ip/sram_32x8_9T/lib/sram_32x8_9T__ss_125C_3v00.lib
    # Real extracted parasitics + structural netlist, used for signoff
    # STA in place of the lib above (STA_MACRO_PRIORITIZE_NL defaults to
    # True, so OpenROAD.STAPrePNR/STAPostPNR & CheckMacroInstances pick
    # these automatically whenever both are present). Single file for
    # all corners is correct here, not an approximation: Magic's
    # ext2spice found zero resistance on signal routes (gen_spef.py),
    # so this is a pure capacitance extraction from fixed layout
    # geometry -- genuinely corner-independent, unlike the lib above.
    nl:
      - dir::../ip/sram_32x8_9T/nl/sram_32x8_9T.nl.v
    spef:
      "*":
        - dir::../ip/sram_32x8_9T/spef/sram_32x8_9T.spef
    instances:
      # Hierarchy updated: removed i_chip_core prefix
      # 2x2 grid inside the 1100x1100 core (macro is 44.255 x 181.215um);
      # 400um X/Y pitch leaves >350um clearance on every side for halo,
      # routing channels and standard cells.
      DCIM_ARRAY.u_sram_32x8_9T_0:
        location: [300, 250]
        orientation: MY
      DCIM_ARRAY.u_sram_32x8_9T_1:
        location: [700, 250]
        orientation: MY
      DCIM_ARRAY.u_sram_32x8_9T_2:
        location: [300, 650]
        orientation: MY
      DCIM_ARRAY.u_sram_32x8_9T_3:
        location: [700, 650]
        orientation: MY

# Filler/decap cells have no signal pins -- just VDD/VSS -- and are
# deterministically inserted by Fill Insertion, so LVS has nothing
# functional to verify on them (fill density/tap spacing is a DRC
# concern, not LVS). With ~49k of ~57k devices being these, netgen's
# LVS has to fully resolve one enormous symmetric equivalence class to
# prove a unique match, which blows up its isomorphism refinement
# (this is why it only hangs when the netlists actually match -- a
# real mismatch lets it bail out early instead of proving uniqueness).
LVS_IGNORE_CELLS:
- gf180mcu_as_sc_mcu7t3v3__fill_1
- gf180mcu_as_sc_mcu7t3v3__fill_2
- gf180mcu_as_sc_mcu7t3v3__fillcap_4
- gf180mcu_as_sc_mcu7t3v3__fillcap_8
- gf180mcu_as_sc_mcu7t3v3__fillcap_16

FP_PDN_MACRO_HOOKS:
- "DCIM_ARRAY.u_sram_32x8_9T_0 VDD VSS VDD VSS"
- "DCIM_ARRAY.u_sram_32x8_9T_1 VDD VSS VDD VSS"
- "DCIM_ARRAY.u_sram_32x8_9T_2 VDD VSS VDD VSS"
- "DCIM_ARRAY.u_sram_32x8_9T_3 VDD VSS VDD VSS"

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Global thread count per worker process
KLAYOUT_DRC_THREADS: 4

# DRC options block containing worker count
KLAYOUT_DRC_OPTIONS:
  feol: true
  beol: true
  run_mode: "deep"
  conn_drc: true
  dummy: true
  dummy_no_sub_prev: true
  offgrid: true
  wedge: true
  decks: "all,-antenna,-density,-cup"
  variant: ref::$PDK
  workers: max

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max
