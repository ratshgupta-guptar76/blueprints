meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Disable KLayout DRC
    KLayout.DRC: null
    Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    KLayout.Antenna: null
    Checker.KLayoutAntenna: null

    # Disable KLayout density check
    KLayout.Density: null
    Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    OpenROAD.IRDropReport: null
    Magic.DRC: null
    Checker.MagicDRC: null
    KLayout.XOR: null
    # Netgen.LVS: null
    # Checker.LVS: null

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/dcim_pkg.sv
- dir::../src/shift_reg.sv
- dir::../src/act_shift_chain.sv
- dir::../src/row_decoder.sv
- dir::../src/dcim_array.sv
- dir::../src/col_adder.sv
- dir::../src/adder_tree.sv
- dir::../src/lane_shift_accum.sv
- dir::../src/shift_accum.sv
- dir::../src/weight_load.sv
- dir::../src/stream_out.sv
- dir::../src/control_fsm.sv
- dir::../src/dcim_top.sv
- dir::../src/chip_core.sv
- dir::../src/chip_top.sv
- dir::../ip/sram_32x8_9T/vh/sram_32x8_9T_blackbox.v

# Enable plugin for better SystemVerilog support
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

EXTRA_VERILOG_MODELS:
  - dir::../gf180mcu/gf180mcuD/libs.ref/gf180mcu_fd_io/verilog/gf180mcu_fd_io__blackbox.v
  - dir::../gf180mcu/gf180mcuD/libs.ref/gf180mcu_fd_io/verilog/gf180mcu_ef_io__blackbox.v
  - dir::../gf180mcu/gf180mcuD/libs.ref/gf180mcu_fd_io/verilog/gf180mcu_ws_io__blackbox.v

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

RUN_MAGIC_STREAMOUT: False

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# We need to add gf180mcu_fd_io__bi_24t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__id
- gf180mcu_ws_ip__logo

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 40 # 25 MHz

# Fix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# Increase for more logic
# on your die
PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

# Due to OpenROAD bug
# https://github.com/The-OpenROAD-Project/OpenROAD/issues/8229
#PL_TIME_DRIVEN: False
#PL_ROUTABILITY_DRIVEN: False

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

MACROS:
  sram_32x8_9T:
    gds:
      - dir::../ip/sram_32x8_9T/gds/sram_32x8_9T.gds
    lef:
      - dir::../ip/sram_32x8_9T/lef/sram_32x8_9T.lef
    vh:
      - dir::../ip/sram_32x8_9T/vh/sram_32x8_9T_blackbox.v
    lib:
      "*":
        - dir::../ip/sram_32x8_9T/lib/sram_32x8_9T.lib
    instances:
       i_chip_core.U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_0:
        location: [700, 700]
        orientation: N
       i_chip_core.U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_1:
        location: [1000, 700]
        orientation: N
       i_chip_core.U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_2:
        location: [700, 1000]
        orientation: N
       i_chip_core.U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_3:
        location: [1000, 1000]
        orientation: N

# No user macros for the workshop slot -- the core is a trivial
# counter.  chip_id + wafer.space logo (above) are the only placed
# macros.

# All 4 SRAM instances sit at the same Y as the original working
# placement -- PDN_HPITCH-spaced Metal5 straps run horizontally across
# the *entire* die width, so keeping Y fixed and only varying X
# guarantees every instance gets the same grid crossing that made the
# single-instance case connect (see pdn_cfg.tcl).
FP_PDN_MACRO_HOOKS:
- "i_chip_core.U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_0 VDD VSS VDD VSS"
- "i_chip_core.U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_1 VDD VSS VDD VSS"
- "i_chip_core.U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_2 VDD VSS VDD VSS"
- "i_chip_core.U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_3 VDD VSS VDD VSS"

# Halo size around macros while cutting rows.
# Workaround for: https://github.com/The-OpenROAD-Project/OpenROAD/issues/8868
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
PDN_HORIZONTAL_HALO: 5
PDN_VERTICAL_HALO: 5

PDN_CFG: dir::pdn_cfg.tcl

# # Make sure netgen doesn't create 'no_connect' nets
# # Not needed since netgen 1.5.303
# LVS_FLATTEN_CELLS:
# - gf180mcu_ws_ip__id
# - gf180mcu_ws_ip__logo

# # gf180mcu_ws_ip__id/logo has no ports and components
# # therefore make it an abstract cell in the layout
# MAGIC_EXT_ABSTRACT_CELLS:
# - gf180mcu_ws_ip__id
# - gf180mcu_ws_ip__logo

# Global thread count per worker process
KLAYOUT_DRC_THREADS: 4

# DRC options block containing worker count
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup"
  variant: ref::$PDK
  workers: max

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max
