# "Quadrant" overlay for chip_top: the DCIM core confined to a 1110x1110um
# box (the real A07 core block's own size) sitting in the top-left quadrant
# of the die, on the *same* 2935x2935um die slot_workshop.yaml already
# uses -- DIE_AREA is intentionally unchanged from that slot, not enlarged.
#
# Earlier attempt doubled DIE_AREA to 5870x5870 to make room for the
# quadrant, but a control test proved DIE_AREA size alone (independent of
# core position -- even with CORE_AREA and macros left untouched at their
# original centered values) was what broke PDN connectivity: OpenROAD's
# add_pdn_ring core-ring-to-pad bridge (PDN_CORE_RING_CONNECT_TO_PADS)
# apparently can't handle a much-larger die/pad gap even symmetrically,
# producing ~3.4M [PSM-0069] connectivity violations. Keeping DIE_AREA at
# the slot's original 2935x2935 avoids that failure mode entirely.
#
# The box's position was first tried at the real A07 core's own offset,
# (350, 1475) per def/A07/project_defs/A/A07_A_interface.yaml -- valid
# within the top-left quadrant, but its 350um gap to the north die edge
# (smaller than any other side) produced ~5.8K residual [PSM-0069]
# connectivity violations, confined to the topmost rows' left/right ends
# specifically -- the same 1475um south gap and 350/1475um west/east gaps
# were all violation-free, so 350um specifically was too tight for
# add_pdn_ring's core-ring-to-pad bridge. Using the *same* 442um margin
# that the original centered design (CORE_AREA flush 442um from all four
# edges of the same 2935x2935 die) already proves clean on the box's two
# near edges (west, north) resolves that, at the cost of no longer using
# the exact real A07 offset -- the box still sits in the top-left quadrant
# ([0,1467.5]x[1467.5,2935]), just centered a bit more within it.
#
# This is deliberately a separate file from librelane/config.yaml rather than
# an edit to slot_workshop.yaml: config.yaml's own MACROS block is shared by
# every slot, and LibreLane's config merge does a shallow top-level-key
# replace (see GenericDict.update_reorder), so this file must be passed AFTER
# config.yaml on the command line (see the librelane-quadrant Make target) so
# its MACROS.instances below win, without touching config.yaml or any other
# slot file. It lives in librelane/ (not librelane/slots/) so that being the
# last file on the command line doesn't change LibreLane's `design_dir`
# resolution away from librelane/ -- config.yaml's `dir::../src/...` paths
# depend on that.

# Floorplanning: same die and pad-ring cell lists as slot_workshop.yaml.
FP_SIZING: absolute
DIE_AREA: [0, 0, 2935, 2935]

# 1110x1110um box, flush 442um from the west and north die edges (the same
# margin the original centered design uses on all four edges), landing in
# the top-left quadrant: X=[442, 1552], Y=[2935-442-1110, 2935-442].
CORE_AREA: [442, 1383, 1552, 2493]

VERILOG_DEFINES: ["SLOT_WORKSHOP"]

