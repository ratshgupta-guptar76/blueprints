# SRAM macros: same cell/view paths as config.yaml's MACROS block (this
# whole top-level key replaces config.yaml's, so it must be fully
# self-contained, not just the instances). The 1110x1110 box here is too
# small to reuse config.yaml's own 2051x2051-core macro layout (its Y
# offsets alone, 1125/1500, exceed this box's 1110 height), so instead
# this reuses config_core.yaml's macro layout instead -- tuned for exactly
# this size box (its own DIE_AREA is [0,0,1110,1110]) -- translating those
# absolute coordinates by this box's own offset, (442, 1383).
MACROS:
  sram_32x8_9T:
    gds:
      - dir::../ip/sram_32x8_9T/gds/sram_32x8_9T.gds
    lef:
      - dir::../ip/sram_32x8_9T/lef/sram_32x8_9T.lef
    vh:
      - dir::../ip/sram_32x8_9T/vh/sram_32x8_9T_blackbox.v
    lib:
      "*":
        - dir::../ip/sram_32x8_9T/lib/sram_32x8_9T__tt_025C_3v30.lib
    nl:
      - dir::../ip/sram_32x8_9T/nl/sram_32x8_9T.nl.v
    spef:
      "*":
        - dir::../ip/sram_32x8_9T/spef/sram_32x8_9T.spef
    instances:
      i_chip_core.U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_0:
        location: [742, 1633]
        orientation: MY
      i_chip_core.U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_1:
        location: [1142, 1633]
        orientation: MY
      i_chip_core.U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_2:
        location: [742, 2033]
        orientation: MY
      i_chip_core.U_DCIM_TOP.DCIM_ARRAY.u_sram_32x8_9T_3:
        location: [1142, 2033]
        orientation: MY
